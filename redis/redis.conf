# ---------------------------------------------------------------------------
# Sigilo :: Redis endurecido para uso EFÊMERO
# Regra central: nada aqui pode tocar o disco. Nunca.
# ---------------------------------------------------------------------------

# --- Zero persistência --------------------------------------------------
# Sem snapshot RDB.
save ""
# Sem AOF.
appendonly no
# Se um BGSAVE falhar, não pare de aceitar escrita (não há BGSAVE, mas
# deixa explícito que persistência não é um requisito deste serviço).
stop-writes-on-bgsave-error no
# Não tente salvar no shutdown.
rdbcompression no
rdbchecksum no

# --- Memória ------------------------------------------------------------
maxmemory 256mb
# Tudo aqui é descartável por natureza; expulsar é preferível a estourar.
maxmemory-policy allkeys-lru
# Amostragem maior = expulsão mais próxima do LRU real.
maxmemory-samples 10

# --- Superfície de ataque ----------------------------------------------
protected-mode yes
# Comandos que permitem varrer ou observar o tráfego inteiro morrem aqui.
rename-command KEYS ""
rename-command MONITOR ""
rename-command DEBUG ""
rename-command CONFIG ""
rename-command SHUTDOWN ""
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command SAVE ""
rename-command BGSAVE ""
rename-command BGREWRITEAOF ""
rename-command REPLICAOF ""
rename-command SLAVEOF ""
rename-command MODULE ""

# --- Log ----------------------------------------------------------------
# Nunca escreva log em arquivo; stdout do container, nível mínimo.
logfile ""
loglevel warning
# Sem log de comandos lentos: o argumento de um SET é o envelope cifrado,
# e mesmo cifrado ele não precisa aparecer em lugar nenhum.
slowlog-log-slower-than -1
slowlog-max-len 0

# --- Rede ---------------------------------------------------------------
bind 0.0.0.0
port 6379
tcp-keepalive 60
timeout 0
