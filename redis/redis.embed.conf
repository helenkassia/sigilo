# Redis embutido (Railway / container único). Só escuta localhost.
# Mesma regra do Sigilo: nada toca o disco de verdade — dir em /tmp.
save ""
appendonly no
stop-writes-on-bgsave-error no
rdbcompression no
rdbchecksum no

dir /tmp/redis
dbfilename dump.rdb

maxmemory 256mb
maxmemory-policy allkeys-lru
maxmemory-samples 10

protected-mode yes
bind 127.0.0.1
port 6379
tcp-keepalive 60
timeout 0

logfile ""
loglevel warning
slowlog-log-slower-than -1
slowlog-max-len 0

rename-command KEYS ""
rename-command MONITOR ""
rename-command DEBUG ""
rename-command CONFIG ""
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command SAVE ""
rename-command BGSAVE ""
rename-command BGREWRITEAOF ""
rename-command REPLICAOF ""
rename-command SLAVEOF ""
rename-command MODULE ""
